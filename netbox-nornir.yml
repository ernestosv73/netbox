name: netbox
mgmt:
  network: netbox
  ipv4-subnet: 172.80.80.0/24
topology:
  nodes:

    # Fortigate FW
    fw:
      kind: fortinet_fortigate
      mgmt-ipv4: 172.80.80.6
      image: vrnetlab/vr-fortios:6.4.1
      env:
        QEMU_SMP: 1
        QEMU_MEMORY: 1024
      ports:
        - 80:80
        - 443:443  
    
    huawei-router:
      kind: huawei_vrp
      mgmt-ipv4: 172.80.80.7
      image: vrnetlab/huawei_vrp:ne40e-8.180
      startup-config: configs/myconfig.txt    

    srlswitch:
      kind: nokia_srlinux
      mgmt-ipv4: 172.80.80.5
      labels:
        graph-icon: switch
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixrd3
      startup-config: configs/srlswitch.cfg 
    
        
    nornir:
      kind: linux
      image: esanchezv/kali-python3:latest 
      binds:
       - configs/nornir.sh:/root/nornir.sh
       - configs/ansible.sh:/root/ansible.sh
       - configs/ansible/automation:/root/automation
      exec:
       - python3 -m pip config set global.break-system-packages true
       - chmod +x /root/nornir.sh
       - chmod 644 /root/automation/ansible.cfg    
       - bash /root/nornir.sh 
    
       
    PC3:
      kind: linux
      image: docker.io/esanchezv/kaliipv6:latest  
      #exec:
        #- ip -6 route del default dev eth0    

    PC4:
      kind: linux
      image: docker.io/esanchezv/kaliipv6:latest  
      #exec:
        #- ip -6 route del default dev eth0    
      
  links:
   - endpoints: ["huawei-router:eth2", "fw:eth1"]
   - endpoints: ["huawei-router:eth1", "srlswitch:e1-1"]  
   - endpoints: ["srlswitch:e1-3", "PC3:eth1"]
   - endpoints: ["srlswitch:e1-4", "PC4:eth1"]   
   - endpoints: ["srlswitch:e1-5", "nornir:eth1"]   
   
    
