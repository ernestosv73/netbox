runner:
  plugin: threaded
  options:
    num_workers: 10

inventory:
  plugin: NetBoxInventory2
  options:
    nb_url: "http://192.168.117.135:8000"
    nb_token: "c889397e6b09cfd1556378047213220b2c47b7e8"
    ssl_verify: false

    # Qué objetos traer
    include_devices: true
    include_vms: false

    # Filtros (MUY importante)
    device_query_filters:
      - manufacturer: huawei
      - status: active

    # Mapeos
    hostname_source: primary_ip
    platform: platform.slug

    # Credenciales
    defaults:
      username: admin
      password: admin
